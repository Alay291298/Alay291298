<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Selected impact results: 40 percent less manual effort, over 95 percent PCB traceability, automation exposure across over 30 departments, competition honors">
<title>Selected impact: 40% less manual effort · 95%+ PCB traceability · 30+ departments · 3 competition honors</title>
<defs>
