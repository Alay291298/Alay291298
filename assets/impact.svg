  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}
    .bar.b{animation-delay:.25s}.bar.c{animation-delay:.5s}.bar.d{animation-delay:.75s}
    .tick{animation:tick 1.6s ease-in-out infinite}
    @keyframes tick{0%,100%{opacity:.3}50%{opacity:1}}
  </style>
</defs>
<rect x="0.5" y="0.5" width="1199" height="249" rx="12" fill="url(#bg)" stroke="#39F1D1" stroke-opacity="0.25"/>
