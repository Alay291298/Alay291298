<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Alaykumar Pandya — Electrical and Computer Engineer, AI Automation, Robotics, Founder">
<title>Alaykumar Pandya — AI, Automation, Embedded Systems and Full-Stack Engineering</title>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#0C2440"/>
    <stop offset="0.55" stop-color="#071629"/>
    <stop offset="1" stop-color="#030A14"/>
  </radialGradient>
  <linearGradient id="nameGrad" x1="0" x2="1">
    <stop offset="0" stop-color="#39F1D1"/>
    <stop offset="0.5" stop-color="#71CFFF"/>
    <stop offset="1" stop-color="#B1A1FF"/>
  </linearGradient>
  <linearGradient id="fadeH" x1="0" x2="1">
    <stop offset="0" stop-color="#39F1D1" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#39F1D1" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#39F1D1" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#030A14" stop-opacity="1"/>
    <stop offset="1" stop-color="#030A14" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#39F1D1" stroke-opacity="0.07"/>
  </pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="floorClip"><rect x="0" y="300" width="1200" height="120"/></clipPath>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    .spinR{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite reverse}
    .pulse{stroke-dasharray:14 520;animation:flow 4.5s linear infinite}
    .pulse.d1{animation-delay:-1.2s}.pulse.d2{animation-delay:-2.4s}.pulse.d3{animation-delay:-3.3s}
    .scan{animation:scan 6s linear infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    .breathe{animation:breathe 3.2s ease-in-out infinite}
    .floor{animation:floor 2.4s linear infinite}
    .node{animation:node 2.4s ease-in-out infinite}
    .node.n2{animation-delay:.6s}.node.n3{animation-delay:1.2s}.node.n4{animation-delay:1.8s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes flow{from{stroke-dashoffset:534}to{stroke-dashoffset:0}}
    @keyframes scan{0%{transform:translateY(-10px);opacity:0}8%{opacity:.8}92%{opacity:.8}100%{transform:translateY(430px);opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes floor{from{transform:translateY(0)}to{transform:translateY(24px)}}
    @keyframes node{0%,100%{fill:#0B2236}50%{fill:#39F1D1}}
  </style>
</defs>

<rect width="1200" height="420" fill="url(#bg)"/>
<rect width="1200" height="420" fill="url(#grid)"/>

<!-- perspective floor -->
<g clip-path="url(#floorClip)" stroke="#39F1D1" stroke-opacity="0.18" fill="none">
  <g class="floor">
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="324" x2="1200" y2="324"/>
    <line x1="0" y1="348" x2="1200" y2="348"/><line x1="0" y1="372" x2="1200" y2="372"/>
    <line x1="0" y1="396" x2="1200" y2="396"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="276" x2="1200" y2="276"/>
  </g>
  <path d="M600 300L-600 420M600 300L-200 420M600 300L100 420M600 300L350 420M600 300L600 420M600 300L850 420M600 300L1100 420M600 300L1400 420M600 300L1800 420"/>
</g>
<rect x="0" y="296" width="1200" height="60" fill="url(#floorFade)"/>

<!-- circuit traces -->
<g fill="none" stroke="#39F1D1" stroke-opacity="0.22" stroke-width="1.5">
  <path id="t1" d="M0 70H120L150 100H300"/>
  <path id="t2" d="M0 250H70L100 220H220L250 190H330"/>
  <path id="t3" d="M1200 80H1080L1050 110H900"/>
  <path id="t4" d="M1200 260H1120L1090 230H980L950 200H870"/>
</g>
<g fill="none" stroke="#39F1D1" stroke-width="2.4" stroke-linecap="round" filter="url(#soft)">
  <path class="pulse" d="M0 70H120L150 100H300"/>
  <path class="pulse d1" d="M0 250H70L100 220H220L250 190H330"/>
  <path class="pulse d2" stroke="#B1A1FF" d="M1200 80H1080L1050 110H900"/>
  <path class="pulse d3" stroke="#71CFFF" d="M1200 260H1120L1090 230H980L950 200H870"/>
</g>
<g fill="#0B2236" stroke="#39F1D1" stroke-width="1.5">
  <circle class="node" cx="300" cy="100" r="4"/>
  <circle class="node n2" cx="330" cy="190" r="4"/>
  <circle class="node n3" cx="900" cy="110" r="4"/>
  <circle class="node n4" cx="870" cy="200" r="4"/>
</g>

<!-- HUD rings left -->
<g transform="translate(118 160)">
  <circle r="58" fill="none" stroke="#39F1D1" stroke-opacity="0.12"/>
  <circle class="spin" r="50" fill="none" stroke="#39F1D1" stroke-width="2" stroke-dasharray="60 18 8 18" stroke-opacity="0.7"/>
  <circle class="spinR" r="38" fill="none" stroke="#71CFFF" stroke-width="1.2" stroke-dasharray="3 7" stroke-opacity="0.8"/>
  <circle r="20" fill="#0B2236" stroke="#39F1D1" stroke-opacity="0.6"/>
  <path d="M-8 -8h16v16h-16zM-4 -14v6M0 -14v6M4 -14v6M-4 8v6M0 8v6M4 8v6M-14 -4h6M-14 0h6M-14 4h6M8 -4h6M8 0h6M8 4h6" fill="none" stroke="#39F1D1" stroke-width="1.6" stroke-linecap="round"/>
  <text class="mono" y="82" fill="#7FA3BF" font-size="10" text-anchor="middle" letter-spacing="2">HARDWARE</text>
</g>
<!-- HUD rings right -->
<g transform="translate(1082 160)">
  <circle r="58" fill="none" stroke="#B1A1FF" stroke-opacity="0.12"/>
  <circle class="spinR" r="50" fill="none" stroke="#B1A1FF" stroke-width="2" stroke-dasharray="40 14 4 14" stroke-opacity="0.7"/>
  <circle class="spin" r="38" fill="none" stroke="#71CFFF" stroke-width="1.2" stroke-dasharray="2 6" stroke-opacity="0.8"/>
  <circle r="20" fill="#0B2236" stroke="#B1A1FF" stroke-opacity="0.6"/>
  <g fill="none" stroke="#B1A1FF" stroke-width="1.6" stroke-linecap="round">
    <circle cx="0" cy="-8" r="2.6"/><circle cx="-8" cy="6" r="2.6"/><circle cx="8" cy="6" r="2.6"/>
    <path d="M-1.4 -5.6-6.6 3.6M1.4 -5.6 6.6 3.6M-5.4 6H5.4"/>
  </g>
  <text class="mono" y="82" fill="#7FA3BF" font-size="10" text-anchor="middle" letter-spacing="2">INTELLIGENCE</text>
</g>

<!-- center content -->
<g>
  <text class="mono" x="600" y="92" fill="#39F1D1" font-size="13" text-anchor="middle" letter-spacing="3">
    <tspan class="breathe">●</tspan> SYSTEM ONLINE  //  OPERATOR: ALAY291298
  </text>
  <text class="sans" x="600" y="172" fill="url(#nameGrad)" font-size="66" font-weight="800" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs" filter="url(#glow)">ALAYKUMAR PANDYA</text>
  <rect x="330" y="194" width="540" height="1.5" fill="url(#fadeH)"/>
  <text class="mono" x="600" y="226" fill="#D7E9F7" font-size="15" text-anchor="middle" textLength="700" lengthAdjust="spacingAndGlyphs">ELECTRICAL &amp; COMPUTER ENGINEER  ·  AI AUTOMATION  ·  ROBOTICS  ·  FOUNDER</text>
  <text class="mono" x="600" y="256" fill="#7FA3BF" font-size="13" text-anchor="middle" letter-spacing="1">&gt; from circuits to cloud — from ideas to impact<tspan class="blink" fill="#39F1D1">▌</tspan></text>
</g>

<!-- status bar -->
<g class="mono" font-size="11" letter-spacing="2">
  <text x="40" y="398" fill="#7FA3BF">HOUSTON, TX  ·  29.76°N 95.37°W</text>
  <text x="1160" y="398" fill="#7FA3BF" text-anchor="end">REVOLUTION AUTOMATION TECH  <tspan class="blink" fill="#39F1D1">■</tspan></text>
  <g transform="translate(600 398)" text-anchor="middle">
    <text fill="#39F1D1">[ CIRCUITS ] ── [ CODE ] ── [ CLOUD ] ── [ AI ]</text>
  </g>
</g>

<!-- scanline -->
<rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#fadeH)" opacity="0.6"/>

<!-- frame -->
<g fill="none" stroke="#39F1D1" stroke-width="2" stroke-opacity="0.75">
  <path d="M14 44V14H44"/><path d="M1156 14H1186V44"/><path d="M1186 376V406H1156"/><path d="M44 406H14V376"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#39F1D1" stroke-opacity="0.15"/>
</svg>
